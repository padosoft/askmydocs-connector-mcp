name: tests

# MCP Pack v2 is not tagged in the Padosoft repository yet. Pin the reviewed
# v2 source commit so CI exercises the same dependency as local development and
# cannot silently fall back to the incompatible v1.5 main branch.
env:
  MCP_PACK_REPOSITORY: bramato/askmydocs-mcp-pack
  MCP_PACK_REF: 82cf9cd085557606fbb3ed9d10650d6e572c65a8

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    name: PHP ${{ matrix.php }} • Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
    steps:
      - name: Checkout connector
        uses: actions/checkout@v4
        with:
          path: askmydocs-connector-mcp
      - name: Checkout MCP Pack
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MCP_PACK_REPOSITORY }}
          ref: ${{ env.MCP_PACK_REF }}
          path: askmydocs-mcp-pack
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, sqlite, pdo_sqlite, json
          coverage: none
      - name: Resolve Laravel matrix
        working-directory: askmydocs-connector-mcp
        run: |
          composer require "illuminate/contracts:${{ matrix.laravel }}" --no-update --no-interaction
          composer update --prefer-dist --no-interaction --no-progress
      - name: Run package tests
        working-directory: askmydocs-connector-mcp
        run: vendor/bin/phpunit --colors=always

  quality:
    name: Static analysis and style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: askmydocs-connector-mcp
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.MCP_PACK_REPOSITORY }}
          ref: ${{ env.MCP_PACK_REF }}
          path: askmydocs-mcp-pack
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, sqlite, pdo_sqlite, json
          coverage: none
      - working-directory: askmydocs-connector-mcp
        run: composer install --prefer-dist --no-interaction --no-progress
      - working-directory: askmydocs-connector-mcp
        run: composer validate --strict
      - working-directory: askmydocs-connector-mcp
        run: find src database tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - working-directory: askmydocs-connector-mcp
        run: composer analyse
      - working-directory: askmydocs-connector-mcp
        run: vendor/bin/pint --test
